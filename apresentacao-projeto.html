<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança Digital 60+ — Apresentação Interativa</title>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.35);
            --bg-dark: #090d16;
            --surface-glass: rgba(18, 24, 38, 0.75);
            --card-glass: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --gradient-blue: linear-gradient(135deg, #38bdf8 0%, #2563eb 60%, #1d4ed8 100%);
            --gradient-orange: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at 15% 15%, #172554 0%, var(--bg-dark) 55%),
                        radial-gradient(circle at 85% 85%, #0f172a 0%, var(--bg-dark) 60%);
            min-height: 100vh;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Moldura do Slide com Glassmorphism */
        .stage-container {
            width: 100%;
            max-width: 1020px;
            aspect-ratio: 16 / 9;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 40px rgba(37, 99, 235, 0.15);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Barra de Progresso no Topo */
        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
        }

        .progress-bar {
            height: 100%;
            width: 16.66%;
            background: var(--gradient-blue);
            transition: width 0.4s ease;
            box-shadow: 0 0 12px #38bdf8;
        }

        .slide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 4px;
        }

        .slide-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .slide-counter {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        /* Área de Conteúdo */
        .slide-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 16px 0;
            animation: fadeIn 0.45s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1.title-hero {
            font-size: 46px;
            font-weight: 800;
            line-height: 1.15;
            background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 14px;
        }

        h2.title-slide {
            font-size: 30px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        p.lead-text {
            font-size: 18px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Grids e Cards Modernos */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .card-interactive {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .card-interactive:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .stat-huge {
            font-size: 34px;
            font-weight: 800;
            color: #38bdf8;
            line-height: 1;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.45;
        }

        /* Botão Interativo tipo Pill / Badges */
        .badge-ods {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            font-size: 13px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 30px;
            margin-right: 10px;
        }

        /* Widget Interativo de Simulação no Slide 4 */
        .simulador-container {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px 22px;
            margin-top: 10px;
        }

        .sim-pergunta {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .sim-botoes {
            display: flex;
            gap: 12px;
        }

        .btn-sim {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-sim:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .sim-feedback {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        /* Rodapé do Slide */
        .slide-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: var(--text-dim);
        }

        .author-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-weight: 600;
        }

        /* Controles Modernos Inferiores */
        .toolbar {
            margin-top: 22px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-action {
            background: var(--card-glass);
            border: 1px solid var(--card-border);
            color: var(--text-light);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-action.primary {
            background: var(--gradient-blue);
            border: none;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-action.primary:hover {
            box-shadow: 0 6px 22px rgba(56, 189, 248, 0.5);
        }

        .btn-action:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .dots-indicator {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            width: 28px;
            border-radius: 10px;
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
        }

        /* Modo de Impressão A4 Limpo */
        @media print {
            body {
                background: white !important;
                color: #0f172a !important;
                padding: 0;
            }
            .toolbar, .progress-bar-container {
                display: none !important;
            }
            .stage-container {
                box-shadow: none;
                border: 1px solid #cbd5e1;
                background: white;
                color: #0f172a;
                width: 100%;
                min-height: 100vh;
                page-break-after: always;
            }
            h1.title-hero, h2.title-slide {
                color: #1e3a8a !important;
                -webkit-text-fill-color: initial !important;
            }
            .card-interactive {
                border: 1px solid #e2e8f0;
                background: #f8fafc;
            }
            .card-title, .card-desc {
                color: #1e293b !important;
            }
        }
    </style>
</head>
<body>

    <div class="stage-container" id="slideStage">

        </div>

        </div>

        <!-- Corpo Principal do Slide -->
        <div class="slide-body" id="slideBody">

        </div>

        <!-- Rodapé do Slide -->
        <div class="slide-footer">
            <div class="author-box">
                <i data-lucide="user-check" style="width: 16px; height: 16px; color: #38bdf8;"></i>
                <span>Discente: <strong>Guilherme Assunção</strong> | Ciência da Computação</span>

            </div>
        </div>
    </div>

    <!-- Barra de Ferramentas / Controles -->
    <div class="toolbar">
        <button class="btn-action" id="btnPrev" onclick="navigate(-1)">
            <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
            Anterior
        </button>

        <div class="dots-indicator" id="dotsContainer"></div>

        <button class="btn-action primary" id="btnNext" onclick="navigate(1)">
            Próximo
            <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
        </button>

        <button class="btn-action" onclick="window.print()" title="Salvar em PDF">
            <i data-lucide="printer" style="width: 18px; height: 18px;"></i>
            Exportar PDF
        </button>
    </div>

                            <i data-lucide="shield-check"></i> Cidadania e Proteção Permanente
                        </h3>
                        <p style="font-size: 16px; color: #f1f5f9; line-height: 1.5; margin: 0;">
                            A intervenção demonstrou que a vulnerabilidade digital da terceira idade não decorre da recusa em aprender, mas da escassez de materiais pedagógicos acessíveis. O projeto entrega um recurso vivo, gratuito e permanente, blindando economias e resgatando a dignidade humana.
                        </p>
                    </div>

                    <div class="grid-2">
                        <div class="card-interactive">
                            <div class="card-title"><i data-lucide="terminal" style="color:#38bdf8;"></i> Formação Cidadã em TI</div>
                            <div class="card-desc">Extrapolação das linhas de código para desenvolver sensibilidade social, escuta ativa e design empático.</div>
                        </div>
                        <div class="card-interactive">
                            <div class="card-title"><i data-lucide="check-circle-2" style="color:#22c55e;"></i> Repositório Ativo</div>
                            <div class="card-desc">Disponibilizado via GitHub Pages para que a comunidade continue consultando autonomamente.</div>
                        </div>
                    </div>
                `
            }
        ];

        let index = 0;

        function updateDeck() {
            const slide = deck[index];
            document.getElementById('slideTagText').innerText = slide.tag;
            document.getElementById('slideCounter').innerText = `Slide ${index + 1} de ${deck.length}`;
            document.getElementById('slideBody').innerHTML = slide.body;

            // Atualiza barra de progresso
            const pct = ((index + 1) / deck.length) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;

            // Botões de navegação
            document.getElementById('btnPrev').disabled = index === 0;
            document.getElementById('btnNext').disabled = index === deck.length - 1;

            // Renderiza bolinhas indicadoras
            const dots = document.getElementById('dotsContainer');
            dots.innerHTML = '';
            deck.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = `dot ${i === index ? 'active' : ''}`;
                dot.onclick = () => { index = i; updateDeck(); };
                dots.appendChild(dot);
            });

            // Reinicializa os ícones do Lucide
            lucide.createIcons();
        }

        function navigate(dir) {
            index = Math.max(0, Math.min(deck.length - 1, index + dir));
            updateDeck();
        }

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') navigate(1);
            if (e.key === 'ArrowLeft') navigate(-1);
        });

        // Simulação Interativa do Slide 4
        function testarGolpe(correto) {
            const fb = document.getElementById('simFeedback');
            fb.style.display = 'block';
            if (correto) {
                fb.style.background = 'rgba(16, 185, 129, 0.2)';
                fb.style.color = '#34d399';
                fb.style.border = '1px solid #10b981';
                fb.innerHTML = '🎉 <strong>Correto!</strong> Sempre ligue para o contato habitual antes de fazer qualquer transferência.';
                lancarConfete();
            } else {
                fb.style.background = 'rgba(239, 68, 68, 0.2)';
                fb.style.color = '#f87171';
                fb.style.border = '1px solid #ef4444';
                fb.innerHTML = '⚠️ <strong>Cuidado!</strong> Nunca envie dinheiro para números desconhecidos sem falar com o parente por voz antes!';
            }
        }

        // Efeito de Confetes
        function lancarConfete() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Inicia
        updateDeck();
    </script>
</body>
</html>
